# config.yml - EdGrim 主要配置
# 源代码链接: https://github.com/MWHunter/edgrim
# 版权所有 © 2025 DefineOutside 及贡献者 / 遵循 GPLv3 开源协议
# 修改过的二进制文件，或带有复制的Grim代码的插件，必须是私有仓库，不得公开售卖此插件。
# 中文翻译提供 Regotly / nuym / Dg32z_ , 如有错误请提交 Issues 并@我

alerts:
    # 除了向有权限的玩家发送作弊vl外，是否还在控制台中打印作弊vl消息？
    print-to-console: true
    # 是否在其他子服中发送控制台的作弊信息
    # 如果正在使用Velocity，你必须在Velocity的配置中启用` bungee-plugin-message-channel `。
    proxy:
        # 作弊消息是否应该发送到连接到代理的子服?
        send: false
        # 此服务器是否接收来自其他子服的作弊消息？
        receive: false

    hover:
        enabled: true

    click:
        enabled: true
        command: "/edgrim spectate %player%"

verbose:
    # 是否在控制台中打印verbose信息
    print-to-console: false
# 是否检查更新
check-for-updates: true

client-brand:
    # 这意味着如果客户端型号匹配以下正则表达式，它将不会将其客户端版本显示在聊天栏中
    ignored-clients:
        - "^vanilla$"
        - "^fabric$"
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4}$"
        - "^Feather Fabric$"
        - "^labymod$"
    # Grim 将把包含内置攻击距离修改功能的特定 Forge 版本列入黑名单（Forge 1.18.2 至 1.19.3） 可能会导致1.18.2-1.19.3的Forge版本玩家无法进入服务器。
    # 将此选项设置为 false 将允许上述客户端连接服务器。禁用此选项需自行承担风险（建议打开）。
    disconnect-blacklisted-forge-versions: true

spectators:
    # 将拥有 edgrim.spectator 权限的人进行隐藏,不管他是否在观察玩家
    hide-regardless: false
    # 观察者在这些世界不会隐藏
    allowed-worlds:
        - ""

# 在玩家无法接收 EdGrim的 transaction 数据包后,多少秒对玩家进行踢出
# 踢出原因为: disconnect.timeout
# 玩家超时踢出时间（默认 = 60 秒）
max-transaction-time: 60

# Enable this to stop Grim cancelling pongs received from players.
# This may improve compatibility with other anticheats. It may cause issues with packet limiters.
# Do not enable this if you are not sure what you are doing.
disable-pong-cancelling: false

# 是否对重复的移动数据包进行撤销?
# 这可以修复 "bucket desync". https://bugs.mojang.com/browse/MC-12363,不过Mojang已经在1.21修复了这个问题
# 这仅仅适用于1.8服务器中使用1.17-1.20.5版本的玩家
cancel-duplicate-packet: true

# 是否忽视重复的数据包中的玩家转头
ignore-duplicate-packet-rotation: false

mitigate-damage:
    enabled: true

Simulation:
    # 当玩家合法时，我们应该将总优势乘以多少
    # 这是默认配置的样子（x 轴 = seconds ，y 轴 = 1/1000 方块）: https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999
    # 玩家移动偏移量判定阈值（单位：方块）
    # 已针对 Optifine 优化三角函数表，若设为 0.001 可减少 FastMath 误报
    # 如果此补偿不起作用，则反作弊记录此玩家作弊
    threshold: 0.03
    # 在玩家受到回弹之前，1 ticks 的判定阈值
    # 假设作弊者与模拟移动的阈值（threshold）是0.0945，该项目设置的是0.07，玩家会立即被回弹到合适的位置
    # -1 关闭
    immediate-setback-threshold: 0.03
    # 在玩家受到回弹之前，累计回弹的阈值
    # 假设作弊者与模拟移动的阈值（threshold）是0.0945，并且触发了10次，应为0.9450
    # 而你设置的值为0.94 ， 作弊者会受到回弹
    # -1 关闭
    max-advantage: 2.5
    # 在默认配置的50秒后，玩家将从4块跑到1块
    # 这是为了防止玩家收集过多的违规行为，并且永远无法清除所有的违规行为
    # 这是默认配置的样子（x 轴 = seconds ，y 轴 = 1/1000 方块）: https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4
    # 设置回退的违规等级阈值
    # 1 为旧行为
    setback-violation-threshold: 1

# 检查玩家是否穿墙
Phase:
    setbackvl: 1 # 错误的方块可以允许爬墙，加上这个检查是相对稳定的
    decay: 0.005

AirLiquidPlace:
    cancelvl: 0

FabricatedPlace:
    cancelvl: 5

FarPlace:
    cancelvl: 5

PositionPlace:
    cancelvl: 5

RotationPlace:
    cancelvl: 5

ScaffoldA:
    # 低 CPS 的 GodBridge/KeepY
    cancelvl: 5
    # 达到 cancelvl 后，持续取消后续方块放置的时间（毫秒）
    cancel-for-ms: 500

ScaffoldB:
    # 检查放置时是否明显没有朝向支撑方块面
    angle: true
    time:
        # 检查低头连续搭路时放块间隔是否过快
        active: true
        # 低于该平均放置间隔(单位: tick)时开始判定
        average: 2
    # 检查玩家在冲刺后短时间内向下放块
    sprint: true
    rotate:
        # 检查放置后的下一 tick 是否出现过大的水平转向变化
        active: true
        # 触发判定所需的最小偏航差值
        difference: 90
    # 检查放置后的下一 tick 是否切换了快捷栏槽位
    tool-switch: true
    cancelvl: 10
    # 达到 cancelvl 后，持续取消后续方块放置的时间（毫秒）
    cancel-for-ms: 500

# 使用模拟移动进行的NoSlow(使用物品时不会减速)检查
# 在这里解释错误的服务器代码......即使在发送垃圾数据包时右键单击和副手按钮也很分辨
# 比其他反作弊更稳定，但请报告任何错误......我在这里修复了大量的代码问题。
NoSlowA:
    # 有多少偏移量是作弊
    # 标志 0.03-0.2 与 NoSlow 一致
    threshold: 0.001
    # 到达多少VL时回弹
    setbackvl: 5
    # 当玩家使用一个物品并被它减慢时衰减多少VL
    decay: 0.05

VelocityA:
    # 当玩家合法时，我们应该将总优势乘以多少
    setback-decay-multiplier: 0.999
    # 我们应该为玩家的移动创建多大的偏移量？
    # 从可能的移动中以方块为单位测量
    threshold: 0.001
    # 在玩家受到回弹之前，1 ticks 的违规行为有多大？
    # -1 关闭
    immediate-setback-threshold: 0.1
    # 在我们开始遭遇回弹之前，我们的优势有多大?
    # -1 关闭
    max-advantage: 1
    # 这是为了防止玩家收集过多的违规行为，并且永远无法清除所有的违规行为
    max-ceiling: 4
    setbackvl: 1


VelocityB:
    threshold: 0.001
    setbackvl: 1

VelocityC:
    allowed-jump-reset: true
    min-velocity: 90
    setbackvl: 1

TimerA:
    setbackvl: 10
    # 玩家卡顿时可以累积以供以后使用的毫秒数
    # 如果设置得太高，可能会允许 1.8 快速使用/快速治疗/快速弓箭绕过，120 毫秒似乎是一个很好的平衡
    drift: 120

# 此项是config是用来防止玩家移动与实时差距过大，来限制对 TimerA 平衡机制的滥用。
TimerLimit:
    # 在检查玩家的延迟时对timer balance进行限制, 防止滥用
    # 在合法玩家的延迟超过这个延迟阈值时可能会造成误拉回
    # 填写-1则关闭
    ping-abuse-limit-threshold: 1000

NegativeTimer:
    # 在开始检查玩家时，玩家的移动丢失了多少毫秒数
    drift: 1200

# 与 TimerA 相同的检查方法，但适用于坐骑
VehicleTimer:
    # 实体1.0005 检查
    setbackvl: 10

PacketOrderI:
    # 如果玩家因使用 1.7 动画模组而被标记，则启用此项
    exempt-placing-while-digging: false

Reach:
    # 我们应该将碰撞箱扩大多少？ 0.0005 应该检测到 3.0005+ reach
    #
    # 在 1.9-1.18.1（不是 1.18.2）或某些客户端/服务器组合中存在 0.03 距离的增加，因为
    # 协议更改和限制。 对于 1.8 服务器上的 1.7/1.8 客户端，此检查功能最为强大。
    threshold: 0.0005
    # 我们应该取消我们知道不可能的命中吗？
    # 3.00-3.03 命中可能会通过，但仍会被标记，因为数据包顺序限制
    block-impossible-hits: true
    # 这将在每个ticks结束时发送一个额外的数据包，以检查作弊的可能性
    # 这会注入服务器的连接列表以在服务器刷新之前发送最终数据包
    # 启用这将增加所有玩家的带宽使用
    # 这不会降低整体服务器性能
    # 启用此功能将捕获更多作弊者。
    # 禁用此功能仍会捕获作弊者，不会导致误报
    # 除非你是专注于 1.8 PvP 的服务器，否则不建议使用这个额外的数据包
    enable-post-packet: false

# Aim 系列（AimA-AimW）
# 说明：以下为所有 Aim 检测的默认参数，未列出的检测仅使用内置阈值

AimF:
    # 低加速度 + 低角度组合检测
    buffer: 7
    min-deltaX: 0.4
    max-deltaXAccel: 0.1
    max-rotation-angle: 5.0

AimG:
    # 俯仰轴低加速度检测
    buffer: 7
    min-deltaY: 0.4
    max-deltaY-accel: 0.1

AimH:
    # 低水平/高垂直的动态阈值检测
    buffer: 7
    min-deltaY: 1.0
    max-deltaX: 0.0001

AimJ:
    # 低水平加速度检测（复活/激流豁免）
    buffer: 7
    min-deltaX: 0.4
    max-deltaX-accel: 0.0001

AimL:
    # 方差/离群点异常
    buffer: 4

AimM:
    # 俯仰除数异常行统计
    buffer: 5
    sample-size: 25
    max-invalid-rows: 2
    min-row-length: 3
    min-average-rot: 0.4
    mitigate-vl: 6

AimR:
    # 水平/垂直比值异常
    buffer: 7
    min-deltaX: 1.0
    max-deltaY: 0.0001
    ratio-threshold: 1000.0
    window-size: 5

AimHeuristic:
    basic-component:
        # enabled：是否启用基础启发式采样。
        enabled: true
        # randomizer-flaw：是否启用常见 randomizer flaw 俯仰模式的快速直接 flag。
        randomizer-flaw: true
        # interpolation-average-threshold：interpolation 子检测开始累计缓冲所需的最小平均偏航变化。
        interpolation-average-threshold: 6.5
        # interpolation-buffer：interpolation 子检测触发前需要累计的命中缓冲。
        interpolation-buffer: 4.0
        # interpolation-buffer-decay：interpolation 缓冲在未继续命中时的衰减速度。
        interpolation-buffer-decay: 0.75
    # constant-check：更偏“连续命中门槛”的子检测，达到门槛就会直接 flag。
    constant-check:
        # constant-1-buffer：Constant1 触发所需的最小缓冲（越小越敏感）。
        constant-1-buffer: 8
        # constant-2-buffer：Constant2 触发所需的最小缓冲（越小越敏感）。
        constant-2-buffer: 6
        # constant-3-buffer：Constant3 触发所需的最小缓冲（越小越敏感）。
        constant-3-buffer: 6
    # invalid-check：直接判定“异常数据形态”的子检测（例如无效 pitch/指数极小变化）。
    invalid-check:
        # enabled：是否启用 invalid pitch / 极小指数变化检测。
        enabled: true
    # inconsistent-check：基于样本窗口的离群/重复等统计特征，判断瞄准不一致。
    inconsistent-check:
        # enabled：是否启用 inconsistent 子检测。
        enabled: true
        # buffer：子检测缓冲阈值（越小越敏感，越大越稳健但更慢触发）。
        buffer: 2.0
    # pattern-check：旋转差分模式重复检测（小窗口内 pattern 重复/回放）。
    pattern-check:
        # enabled：是否启用 pattern 子检测。
        enabled: true
        # buffer：pattern 子检测的触发缓冲阈值（越小越敏感）。
        buffer: 2.5
        # buffer-fade：当 pattern 不再出现时，每次回落的缓冲值（越大越快恢复正常）。
        buffer-fade: 0.3
    # factor-check：倍率/尖峰类检测（典型用于“机器心跳/中心尖峰”特征）。
    factor-check:
        # enabled：是否启用 factor 子检测。
        enabled: true
        # buffer：factor 子检测的触发缓冲阈值（越小越敏感）。
        buffer: 2.5
        # ticks-to-reset：缓冲重置/回落的 tick 门槛（越大越“记仇”，越小越快恢复）。
        ticks-to-reset: 2500
    # smooth-check：平滑角度重复检测（低抖动、重复路径）。
    smooth-check:
        # enabled：是否启用 smooth 子检测。
        enabled: true

AimComplex:
    # enabled-entropy：是否启用 entropy 子检测。
    enabled-entropy: true
    # enabled-distinct：是否启用 distinct 子检测。
    enabled-distinct: true
    # enabled-randomizer：是否启用 randomizer 子检测。
    enabled-randomizer: true
    # buffer-limit-entropy：entropy 子检测触发所需的缓冲阈值。
    buffer-limit-entropy: 30
    # buffer-limit-distinct：distinct 子检测触发所需的缓冲阈值。
    buffer-limit-distinct: 4.0
    # buffer-limit-randomizer：randomizer 子检测触发所需的缓冲阈值。
    buffer-limit-randomizer: 2.5

AimAnalysis:
    # enabled-linear：是否启用 linear 子检测。
    enabled-linear: true
    # enabled-rank：是否启用 rank 子检测。
    enabled-rank: true
    # enabled-longterm：是否启用 long-term 子检测。
    enabled-longterm: true
    # buffer-limit-rank：rank 子检测触发所需的缓冲阈值。
    buffer-limit-rank: 6.0

AimStatistics:
    # enabled-iqr：是否启用 IQR 子检测。
    enabled-iqr: true
    # enabled-bot-pattern：是否启用 bot-pattern 子检测。
    enabled-bot-pattern: true
    # enabled-zfactor：是否启用 zFactor 子检测。
    enabled-zfactor: true
    # enabled-improbable：是否启用 improbable 组合检测。
    enabled-improbable: true
    # buffer-limit-iqr：IQR 子检测触发所需的缓冲阈值。
    buffer-limit-iqr: 11.0
    # buffer-limit-zfactor：zFactor 子检测触发所需的缓冲阈值。
    buffer-limit-zfactor: 7.0
    # buffer-limit-improbable：improbable 组合检测触发所需的缓冲阈值。
    buffer-limit-improbable: 15.0

exploit:
    #是否允许玩家在使用鞘翅时候进行的疾跑跳跃
    allow-sprint-jumping-when-using-elytra: true
    # 该选项可在发生鬼块时重新同步玩家，从而减轻玩家在鬼块上的位置。
    # 这可以在玩家遇到幽灵方块时进行同步，这可以减少玩家所碰到幽灵方块
    allow-building-on-ghostblocks: true
    distance-to-check-if-ghostblocks: 2

# 启用在加入时注入 netty 的日志插件以调试兼容性问题
debug-pipeline-on-join: false

# 启用实验性检查
experimental-checks: false

# 取消有问题的格挡
reset-item-usage-on-item-update: true
reset-item-usage-on-attack: true
reset-item-usage-on-slot-change: true

# Grim有时会取消非法的数据包，比如用timer，在一秒钟内取消了数个数据包后，我们应该踢掉这个玩家？
# 我们认为是应该的，因为有些数据包限制器并不计算被Grim取消的数据包。
packet-spam-threshold: 100
# 启用此项可在玩家因 packet-spam-threshold 被踢时打印堆栈追踪
debug-packet-cancel: false

# Grim 能够强制执行一个规则：被设置为非飞行状态的玩家的 ping 值不能超过 X 毫秒。这是因为 Grim 目前不检查处于飞行状态的玩家。
# 填写-1则关闭
max-ping-out-of-flying: 1000

# 限制玩家在使用鞘翅飞行时使用烟花加速的延迟
# 这可以解决高延迟的玩家可以使用鞘翅时一直使用 1 个烟花就可以加速
# 填写-1则关闭
max-ping-firework-boost: 1000

history:
    enabled: true
    # 使用 /edgrim history <player> 时每页显示多少条记录
    entries-per-page: 15
    # history 指令中插入的服务器名称？如果多个服务器共用同一数据库则很有用
    server-name: Prison
    database:
        # 本地存储使用 SQLITE，外部数据库使用 MYSQL。仅在重启服务器后生效
        type: SQLITE
        # MySQL 连接详情
        host: localhost
        port: 3306
        database: grim
        username: root
        password: ""

# 不要调整这个
config-version: 9
